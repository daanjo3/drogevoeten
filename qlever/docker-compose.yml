# SPARQL endpoint with the datasets of linkeddata/, on http://localhost:7001
#
#   qlever/compose.sh         # index, then serve (docker compose up -d with
#                             # your UID/GID; other arguments go to compose)
#   qlever/compose.sh build   # only make the index
#
# Make the input first, in linkeddata/: `make` and `make rijksmuseum`.
#
# The index service has the `build` profile: compose.sh runs it on a development
# machine, and a plain `up` starts only the server. The deployed server (1 GB of
# memory, see ansible/site.yml) adds the `server` profile: Caddy in front of QLever,
# with TLS. QLever's own port only listens on localhost.
#
# The index service only indexes if there is no index yet or the input is newer,
# so the build is safe to repeat. Both services run as your UID/GID in /data
# (this folder), so the index files end up here owned by you.

services:
  # The same image as the server, so the server can read the index
  index:
    profiles: [build]
    image: docker.io/adfreiburg/qlever:commit-4f9ffab5e3
    # Run as your UID/GID directly, not with -e UID/GID: then the entrypoint
    # renames its user with usermod, which fails when the UID is taken in the
    # image (1000 is its `ubuntu` user). As another user, it skips that and
    # runs the command in a login shell. working_dir must be /data.
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /data
    volumes:
      - ./:/data
      - ../linkeddata/build:/input:ro
    # Index if there is no index yet or the input is newer
    command: ["for f in /input/droge-voeten.nt /input/rijksmuseum/*.nt; do [ $$f -nt rijksmuseum-water.meta-data.json ] && rm -f rijksmuseum-water.meta-data.json; done; test -f rijksmuseum-water.meta-data.json || qlever index --overwrite-existing"]

  qlever:
    image: docker.io/adfreiburg/qlever:commit-4f9ffab5e3
    # See the index service for why user and working_dir are set like this
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /data
    volumes:
      - ./:/data
    ports:
      - "127.0.0.1:7001:7001"
    command: ["exec qlever start --run-in-foreground"]
    restart: unless-stopped

  caddy:
    profiles: [server]
    image: docker.io/library/caddy:2.11.9-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Keeps the certificates between restarts
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      - qlever
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
