<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: #1d1d1f; color: #eee; }
      body { display: flex; flex-direction: column; gap: 8px; padding: 8px; box-sizing: border-box; }
      header { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      button { font: inherit; padding: 4px 12px; }
      #log { font-size: 0.85em; opacity: 0.8; }

      /* Demo host: a container the page sizes; drag its bottom-right corner to try other sizes and aspect ratios */
      #unity-container { width: 80%; height: 70%; min-width: 120px; min-height: 80px; resize: both; overflow: hidden; background: #000; }

      /* The canvas just fills whatever box it's given; Unity follows its size */
      #unity-canvas { display: block; width: 100%; height: 100%; }

      /* ?full=1: the player fills the window, like the app on a phone; the controls float on top */
      body.full { padding: 0; }
      body.full header { position: fixed; z-index: 1; top: 0; left: 0; right: 0; padding: 6px; background: rgb(0 0 0 / 0.5); }
      body.full #unity-container { position: fixed; inset: 0; width: auto; height: auto; resize: none; }
    </style>
  </head>
  <body>
    <!-- Test page. URL parameters: dpr=1.5 (render resolution multiplier), full=1 (fill the window).
         Development builds also read quality, scale, shadows, fps, look and hud (see DebugSettings.cs). -->
    <header>
      <button id="fullscreen" disabled>Fullscreen</button>
      <button id="ping" disabled>Ping Unity</button>
      <span>Water:</span>
      <button class="water" data-m="0" disabled>0</button>
      <button class="water" data-m="0.5" disabled>0.5</button>
      <button class="water" data-m="1.2" disabled>1.2</button>
      <button class="water" data-m="2.4" disabled>2.4 m</button>
      <button class="view" data-view="room" disabled>Room</button>
      <button class="view" data-view="house" disabled>House</button>
      <span id="log">Loading…</span>
    </header>
    <div id="unity-container">
      <canvas id="unity-canvas"></canvas>
    </div>
    <script type="module">
      import { mount } from "./unity-embed.js";

      const log = document.getElementById("log");
      const params = new URLSearchParams(location.search);
      if (params.get("full") === "1") document.body.classList.add("full");
      const dpr = parseFloat(params.get("dpr"));
      const started = performance.now();
      try {
        const unity = await mount(document.getElementById("unity-canvas"), {
          devicePixelRatio: dpr > 0 ? dpr : undefined,
          onProgress: (progress) => (log.textContent = `Loading… ${Math.round(progress * 100)}%`),
        });
        const seconds = ((performance.now() - started) / 1000).toFixed(1);
        console.log(`[test page] ready after ${seconds} s`);

        const controls = [...document.querySelectorAll("button.water, button.view")];
        for (const button of controls) {
          button.disabled = false;
          button.onclick = () =>
            button.dataset.m !== undefined
              ? unity.send("SetWaterHeight", parseFloat(button.dataset.m))
              : unity.send("SetView", button.dataset.view);
        }
        log.textContent = `Ready after ${seconds} s`;

        const fullscreen = document.getElementById("fullscreen");
        fullscreen.onclick = () => unity.setFullscreen(true);

        const ping = document.getElementById("ping");
        ping.onclick = () => unity.send("Ping", `hello at ${new Date().toLocaleTimeString()}`);
        unity.on("pong", (message) => (log.textContent = `Unity replied: ${message}`));

        fullscreen.disabled = ping.disabled = false;
      } catch (error) {
        log.textContent = `Failed to load: ${error}`;
        throw error;
      }
    </script>
  </body>
</html>
