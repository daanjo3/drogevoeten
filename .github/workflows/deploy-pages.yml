# Build app/ and publish it on GitHub Pages: https://daanjo3.github.io/drogevoeten/
# Manual only: Actions > Deploy app to GitHub Pages > Run workflow.
#
# One-time setup: Settings > Pages > Source: "GitHub Actions". Optionally set
# the repository variable RIJKSMUSEUM_SPARQL (Settings > Secrets and variables
# > Actions > Variables) to a public HTTPS endpoint; without it the app shows
# its fallback Rijksmuseum images.
#
# Not deployed: the Unity living room (/woonkamer/, not in git); the app keeps
# showing its placeholder render instead.

name: Deploy app to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; a newer run waits instead of cancelling a running one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # version from the packageManager field
          package_json_file: app/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_RIJKSMUSEUM_SPARQL: ${{ vars.RIJKSMUSEUM_SPARQL }}

      # Pages has no SPA rewrites: serve the app for unknown paths too, so
      # links like /drogevoeten/rijksmuseum-test work on a reload
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
