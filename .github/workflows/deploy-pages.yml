# Build app/ and publish it on GitHub Pages: https://drogevoeten.app/
# (custom domain, set in Settings > Pages; the app is served from the root)
# Manual only: Actions > Deploy app to GitHub Pages > Run workflow.
#
# One-time setup: Settings > Pages > Source: "GitHub Actions". Optionally set
# the repository variable RIJKSMUSEUM_SPARQL (Settings > Secrets and variables
# > Actions > Variables) to a public HTTPS endpoint; without it the app shows
# its fallback Rijksmuseum images.
#
# The Unity living room is not in git. It comes from two assets on a GitHub
# release (upload them with app/scripts/upload-woonkamer.sh):
#   woonkamer-desktop.tar.gz  -> /woonkamer-desktop/  desktop build
#   woonkamer-mobile.tar.gz   -> /woonkamer-mobile/   mobile build
# The app picks one per device. Without the mobile asset phones get the desktop
# build; without either the deploy still runs and the app shows its
# placeholder render.

name: Deploy app to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      woonkamer_release:
        description: Release tag with the Unity builds (woonkamer-desktop.tar.gz, woonkamer-mobile.tar.gz)
        default: v0.1.0

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; a newer run waits instead of cancelling a running one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # version from the packageManager field
          package_json_file: app/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Fetch Unity living room
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.woonkamer_release || 'v0.1.0' }}
        run: |
          for build in woonkamer-desktop woonkamer-mobile; do
            if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$build.tar.gz" --dir "$RUNNER_TEMP"; then
              mkdir -p "public/$build"
              tar -xzf "$RUNNER_TEMP/$build.tar.gz" -C "public/$build"
              # Pages only serves files everyone can read; tar keeps the modes of the machine that packed it
              chmod -R a+rX "public/$build"
              ls -la "public/$build" "public/$build/Build"
            else
              echo "::warning::No $build.tar.gz on release $TAG; deploying without that Unity build"
            fi
          done

      - name: Build
        run: pnpm run build
        env:
          BASE_PATH: /
          VITE_RIJKSMUSEUM_SPARQL: ${{ vars.RIJKSMUSEUM_SPARQL }}

      # Pages has no SPA rewrites: serve the app for unknown paths too, so
      # links like /rijksmuseum-test work on a reload
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
